services:
  postgres:
    image: postgres:16-alpine
    container_name: learnflow-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnflow
    volumes:
      - learnflow_pg_data:/var/lib/postgresql/data

volumes:
  learnflow_pg_data:
